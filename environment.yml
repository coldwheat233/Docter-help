name: medical-appointment
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - sqlite
  - pip:
      # LangGraph & LangChain 核心
      - langgraph>=0.3.0
      - langgraph-checkpoint>=2.0.0
      - langchain>=0.3.0
      - langchain-core>=0.3.0
      - langchain-community>=0.3.0
      # LLM Provider
      - langchain-deepseek>=0.1.0
      - langchain-openai>=0.2.0  # 备用，便于切换其他 OpenAI 兼容服务
      # 多智能体编排
      - langgraph-supervisor>=0.0.15
      - langgraph-swarm>=0.0.14
      # 配置 / 工具
      - python-dotenv>=1.0.0
      - pydantic>=2.0.0
      - pydantic-settings>=2.0.0
      # LangSmith 客户端（自动追踪只需要环境变量，但装上便于调试）
      - langsmith>=0.2.0
      # 测试
      - pytest>=8.0.0
      - pytest-asyncio>=0.23.0
      - pytest-cov>=5.0.0
      # 代码质量
      - ruff>=0.6.0
      - black>=24.0.0
      - mypy>=1.10.0
